[tools]
dotnet = "10"
node = "22"
"github:microsoft/aspire" = "latest"

[tasks.setup]
description = "Install all dependencies (.NET + npm)"
run = [
  "dotnet restore",
  "npm install --prefix copilot-demo.Web.React",
]

[tasks.dev]
description = "Run the full Aspire app (API + React + SQL Server) via the Aspire CLI"
run = "aspire run"
